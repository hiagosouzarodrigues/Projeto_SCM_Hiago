<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>midias html</title>
</head>
<body>
    <h1>Imagem Dinamica</h1>
    <p>Tebte abrir esse site em vaios despositivos diferentes ou simplismente aumentar e diminua o tamanho do seu navegador</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-P.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-M.png" type="image/png">
        <img src="imagens/foto-G.png" alt="Imagem flexivel">
    </picture>
        
    <h1>reproduzindo audios</h1>
    <p>Vamos Aprender a reproduzir audios em html5.</p>
    <audio src="midia/audio teste.mp3" controls autoplay></audio>
    <audio preload="metadata"
        <source src="midia/teste.ogg" type="audio/ogg">
        <source src="midia/teste.wav" type="audio/wav">
       <p>Para ouvir esse audio seu navegador não suporta o elemento. <a href="midia/teste.mp3">click aqui para baixar o arquivo</a></p>
    </audio>
    <!-- MP3 WAV OGG -->
     </body>
     </html>
